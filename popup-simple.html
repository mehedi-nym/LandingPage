<!-- ✅ Simple popup with top-right close (✖) -->
<div id="popupMsg" style="
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  background:#fff;
  color:#000;
  padding:20px 30px;
  border-radius:10px;
  box-shadow:0 0 20px rgba(0,0,0,0.3);
  z-index:10000;
  text-align:center;
  font-family:inherit;
  max-width:90vw;">
  
  <!-- Close (X) icon -->
  <span id="popupClose" style="
    position:absolute;
    top:10px;
    right:15px;
    font-size:24px;
    font-weight:bold;
    color:#555;
    cursor:pointer;
    transition:0.3s;">
    ✖
  </span>

  <p style="margin:0 0 15px; font-weight:600;">🎥 Showing how it works!</p>

  <!-- GIF enlarged -->
  <img src="https://admin.ryoko.world/api/images/file/Simple_and_easy.gif"
       alt="How it works animation"
       style="width:auto; max-width:600px; border-radius:10px; display:block; margin:0 auto;">
</div>

<script>
  // Close when clicking the ✖ icon
  const closeBtn = document.getElementById("popupClose");
  closeBtn.addEventListener("click", () => {
    document.getElementById("popupMsg").style.display = "none";
  });
</script>
